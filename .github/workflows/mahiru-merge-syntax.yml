name: Mahiru merge syntax check

on:
  push:
    branches:
      - merge/mahiru-1.0.3-features
  pull_request:
    branches:
      - main

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Smoke-load merged engines
        run: |
          node -e "require('./lib/mayaCore'); require('./lib/ownerAgent'); require('./lib/scheduler'); require('./lib/callBlocker'); console.log('Mahiru 1.0.3 engines loaded successfully')"
